<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Event Hub | Registration</title>
    <link rel="stylesheet" href="../design/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <h2> Campus Event Hub</h2>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../actions/events.html">Explore Events</a>
            <a href="../actions/" class="active">Register</a>
            <a href="../actions/contact.html">Contact</a>
        </nav>
    </header>

    <!-- Banner -->
    <section class="page-header">
        <h1>Student Registration Desk</h1>
        <p>Book your entry pass or team slot for any upcoming campus activity.</p>
    </section>

    <!-- Form Section -->
    <section class="content-section">
        <form class="custom-form" action="#" method="POST">
            <h2>Enter Your Details</h2>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="e.g. Alex Sharma" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="regNo">Registration Number</label>
                    <input type="text" id="regNo" name="regNo" placeholder="e.g. 12401234" required>
                </div>
                <div class="form-group">
                    <label for="department">School / Department</label>
                    <select id="department" name="department" required>
                        <option value="">Select Branch</option>
                        <option value="CSE">Computer Science & Engineering</option>
                        <option value="ECE">Electronics & Communication</option>
                        <option value="MECH">Mechanical Engineering</option>
                        <option value="CIVIL">Civil Engineering</option>
                        <option value="MGMT">Business & Management</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="email">University Email</label>
                <input type="email" id="email" name="email" placeholder="name@domain.edu" required>
            </div>

            <div class="form-group">
                <label for="eventSelect">Select Event</label>
                <select id="eventSelect" name="eventSelect" required>
                    <option value="">Choose an event to attend</option>
                    <option value="tech-fest">Tech Fest & Hackathon</option>
                    <option value="cultural-fest">Rhythm & Beat: Cultural Fest</option>
                    <option value="sports-meet">Inter-School Sports Meet</option>
                    <option value="cyber-workshop">Ethical Hacking & Cyber Defense</option>
                    <option value="robowars">RoboWars & Line Follower</option>
                    <option value="art-exhibit">Canvas Odyssey: Art Exhibition</option>
                </select>
            </div>

            <div class="form-group">
                <label for="comments">Teammate Information / Special Requests (Optional)</label>
                <textarea id="comments" name="comments" rows="3" placeholder="Add teammate registration numbers or queries..."></textarea>
            </div>

            <button type="submit" class="btn submit-btn">Confirm Registration</button>
        </form>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Campus Event Hub. CSE 326 Web Development Laboratory Project.</p>
    </footer>

</body>
</html>
